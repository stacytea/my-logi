// ===== SHIPMENTS =====
function renderShipments(){
  document.getElementById('topbar-actions').innerHTML='';
  const addBtn=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-size:16px;font-weight:600">出貨訂單</h2>
    <button class="btn primary" onclick="openAddShipment()">＋ 建立出貨訂單</button>
  </div>`;
  if(!D.shipments.length){document.getElementById('main-content').innerHTML=addBtn+`<div class="empty-state"><div class="emoji">🚢</div><p>還沒有出貨訂單</p></div>`;return;}
  let html='';
  [...D.shipments].reverse().forEach(s=>{
    const c=getCountry(s.country);
    const rate=getRate(s.currency,null);
    const freightTWD=s.freight&&rate?Math.round(s.freight*rate):null;
    const parcels=D.parcels.filter(p=>s.parcelIds.includes(p.id));
    const shipdiff=s.shipdate?daysLeft(s.shipdate):null;
    const hasTrack=s.intltrack&&s.intltrack.trim();
    let allItems=[];
    parcels.forEach(p=>{
      const items=p.lineItems&&p.lineItems.length?p.lineItems:(p.items?[{name:p.items,qty:p.qty||1,price:0}]:[]);
      items.forEach(it=>allItems.push({...it,parcelLabel:p.label||p.items||''}));
    });
    const grandTotal=allItems.reduce((ss,r)=>ss+r.qty*(r.price||0),0);
    const hasPrice=allItems.some(r=>r.price>0);
    let itemsHtml='';
    if(allItems.length){
      itemsHtml=`<div style="margin-bottom:10px"><table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr>
        <th style="text-align:left;padding:4px 8px;color:var(--text3);font-size:11px;border-bottom:1px solid var(--border)">品項</th>
        <th style="text-align:center;padding:4px 8px;color:var(--text3);font-size:11px;border-bottom:1px solid var(--border);width:44px">數量</th>
        ${hasPrice?`<th style="text-align:right;padding:4px 8px;color:var(--text3);font-size:11px;border-bottom:1px solid var(--border);width:110px">金額</th>`:''}
      </tr></thead><tbody>`;
      allItems.forEach(r=>{
        itemsHtml+=`<tr>
          <td style="padding:5px 8px;border-bottom:1px solid var(--border)">${r.name||'—'}<span style="font-size:10px;color:var(--text3);margin-left:6px">${r.parcelLabel}</span></td>
          <td style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:center;color:var(--text2)">×${r.qty}</td>
          ${hasPrice?`<td style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;font-family:'DM Mono',monospace">${r.price?(r.qty*r.price).toLocaleString():''}</td>`:''}
        </tr>`;
      });
      if(hasPrice&&grandTotal>0){
        const twdStr=rate?` ≈ NT$ ${Math.round(grandTotal*rate).toLocaleString()}`:'';
        itemsHtml+=`<tr><td colspan="${hasPrice?2:2}" style="padding:6px 8px"></td>
          <td style="padding:6px 8px;font-weight:600;text-align:right;font-family:'DM Mono',monospace">${grandTotal.toLocaleString()} ${s.currency||''}${twdStr}</td>
        </tr>`;
      }
      itemsHtml+=`</tbody></table></div>`;
    }
    html+=`<div class="card" id="sc-${s.id}" style="padding:0;overflow:hidden">
      <div onclick="window._toggleCard('sc-${s.id}')" style="cursor:pointer;padding:16px 20px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px">
            ${s.name}${c?`<span class="badge badge-country" style="font-size:11px">${c.flag} ${c.name}</span>`:''}
          </div>
          <div style="font-size:12px;color:var(--text3);margin-top:3px">
            ${s.shipdate?`預計發貨 ${s.shipdate}`:'未設定發貨日'}
            ${shipdiff!==null?` · ${shipdiff<0?'已過期':'還有'+shipdiff+'天'}`:''}
          </div>
        </div>
        <span class="pc-chevron" style="font-size:11px;color:var(--text3);transition:transform .2s">▼</span>
      </div>
      <div class="pc-body" style="display:none;padding:0 20px 16px">
        <div class="info-pill-row">
          <span class="info-pill">建立 <b>${s.createdAt||'—'}</b></span>
          ${s.freight?`<span class="info-pill">運費 <b>${s.freight.toLocaleString()} ${s.currency}</b>${freightTWD?' ≈ NT$'+freightTWD.toLocaleString():''}</span>`:''}
          ${s.paydate?`<span class="info-pill">結帳日 <b>${s.paydate}</b></span>`:''}
        </div>
        <div style="margin-bottom:10px">${parcels.map(p=>`<span class="tag-chip">${p.label||p.items||p.trackno||'包裹'}</span>`).join('')||'<span style="color:var(--text3);font-size:12px">無關聯包裹</span>'}</div>
        ${itemsHtml}
        <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
          <span style="font-size:12px;color:var(--text2)">國際貨運：</span>
          ${hasTrack?`<span class="tracking-chip has">${s.intltrack}</span><button class="btn xs ghost" onclick="copyText('${s.intltrack}')">複製</button>`:
          `<span class="tracking-chip empty" onclick="openTrackingModal(${s.id})">⚠ 點此填入貨運單號</span>`}
          ${hasTrack?`<button class="btn xs ghost" onclick="openTrackingModal(${s.id})">更新</button>`:''}
        </div>
        ${s.note?`<div style="margin-top:8px;font-size:12px;color:var(--text3)">📝 ${s.note}</div>`:''}
        <div style="display:flex;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
          <button class="btn xs danger" onclick="deleteShipment(${s.id})">刪除訂單</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('main-content').innerHTML=addBtn+html;
}

function openAddShipment(){
  populateCountrySelects();fillCurrencySelect('s-currency');
  ['s-name','s-shipdate','s-paydate','s-intltrack','s-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('s-freight').value=0;
  selectedParcelIds=[];
  const avail=D.parcels.filter(p=>p.status==='in_wh'||p.status==='shipping_to_wh'||p.status==='ordered');
  document.getElementById('s-parcel-select').innerHTML=!avail.length
    ?'<div style="color:var(--text3);font-size:12px;padding:8px">沒有可選的包裹</div>'
    :avail.map(p=>{
      const wh=D.warehouses.find(w=>w.id===p.whId);const c=wh?getCountry(wh.country):null;
      return`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .12s" id="psi-${p.id}" onclick="togglePS(${p.id})">
        <div style="width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;transition:all .12s" id="chk-${p.id}"></div>
        <div style="flex:1"><div style="font-size:13px;font-weight:500">${p.label||p.items||'包裹'}</div>
        <div style="font-size:11px;color:var(--text3)">${c?c.flag+' ':''} ${wh?wh.name:''}</div></div>
      </div>`;
    }).join('');
  openOverlay('shipment');
}
function togglePS(id){
  const el=document.getElementById('psi-'+id),chk=document.getElementById('chk-'+id);
  if(selectedParcelIds.includes(id)){
    selectedParcelIds=selectedParcelIds.filter(x=>x!==id);
    el.style.borderColor='';el.style.background='';chk.style.background='';chk.style.borderColor='';chk.textContent='';
  }else{
    selectedParcelIds.push(id);
    el.style.borderColor='var(--accent)';el.style.background='var(--accent-bg)';
    chk.style.background='var(--accent)';chk.style.borderColor='var(--accent)';chk.textContent='✓';
  }
}
function saveShipment(){
  const s={id:Date.now(),name:document.getElementById('s-name').value.trim(),country:document.getElementById('s-country').value,shipdate:document.getElementById('s-shipdate').value,paydate:document.getElementById('s-paydate').value,currency:document.getElementById('s-currency').value,freight:parseFloat(document.getElementById('s-freight').value)||0,intltrack:document.getElementById('s-intltrack').value.trim(),note:document.getElementById('s-note').value.trim(),parcelIds:[...selectedParcelIds],createdAt:new Date().toISOString().slice(0,10)};
  if(!s.name){toast('請輸入訂單名稱');return}
  D.parcels.forEach(p=>{if(selectedParcelIds.includes(p.id))p.status='shipping_to_tw';});
  D.shipments.push(s);window._save();closeOverlay('shipment');renderShipments();toast('出貨訂單已建立');
}
function deleteShipment(id){
  confirmDialog('刪除訂單後，關聯包裹狀態將還原為在倉。','確認刪除訂單').then(ok=>{
    if(!ok)return;
    const s=D.shipments.find(x=>x.id===id);
    if(s)D.parcels.forEach(p=>{if(s.parcelIds.includes(p.id))p.status='in_wh';});
    D.shipments=D.shipments.filter(x=>x.id!==id);window._save();renderShipments();
  });
}
function openTrackingModal(id){editingTrackId=id;const s=D.shipments.find(x=>x.id===id);document.getElementById('track-no').value=s?.intltrack||'';openOverlay('tracking');}
function saveTracking(){const s=D.shipments.find(x=>x.id===editingTrackId);if(s){s.intltrack=document.getElementById('track-no').value.trim();window._save();}closeOverlay('tracking');renderShipments();toast('貨運單號已更新');}

// ===== WAREHOUSES + COUNTRIES =====
function renderWarehouses(){
  document.getElementById('topbar-actions').innerHTML='';
  let whHtml='';
  if(!D.warehouses.length){
    whHtml=`<div class="empty-state" style="padding:28px 20px"><div class="emoji">🏢</div><p>還沒有集運倉資料</p><small>新增常用集運倉，輕鬆複製地址和電話</small></div>`;
  }else{
    whHtml=`<div class="wh-grid">`;
    D.warehouses.forEach(wh=>{
      const c=getCountry(wh.country);
      const bodyParts=[];
      if(wh.recipient)bodyParts.push({label:'收件人姓名',val:wh.recipient});
      if(wh.address)bodyParts.push({label:'寄件地址',val:wh.address});
      if(wh.phone)bodyParts.push({label:'電話',val:wh.phone});
      if(wh.zip)bodyParts.push({label:'郵遞區號',val:wh.zip});
      if(wh.member)bodyParts.push({label:'會員代號',val:wh.member});
      const bodyHtml=bodyParts.map(b=>`<div style="font-size:11px;color:var(--text3);margin:8px 0 3px">${b.label}</div>${makeCopyRow(b.val,b.label)}`).join('')
        +(wh.url?`<div style="margin-top:8px"><a href="${wh.url}" target="_blank" style="font-size:12px;color:var(--accent);text-decoration:none">🔗 前往官網</a></div>`:'')
        +(wh.note?`<div style="margin-top:8px;font-size:12px;color:var(--text3);background:var(--bg);padding:8px 10px;border-radius:var(--r)">📝 ${wh.note}</div>`:'');
      whHtml+=`<div class="wh-card" id="whcard-${wh.id}">
        <div class="wh-card-head" onclick="toggleWhCard(${wh.id})">
          <div><div class="wh-card-name">${c?c.flag+' ':''}${wh.name}</div><div class="wh-card-sub">${c?c.name:''}${wh.currency?' · '+wh.currency:''}</div></div>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="btn xs ghost" onclick="event.stopPropagation();editWarehouse(${wh.id})">編輯</button>
            <button class="btn xs danger" onclick="event.stopPropagation();deleteWarehouse(${wh.id})">刪除</button>
            <span class="wh-card-chevron">▼</span>
          </div>
        </div>
        <div class="wh-card-body">${bodyHtml}</div>
      </div>`;
    });
    whHtml+=`</div>`;
  }
  const countryRows=D.countries.map(c=>`<tr>
    <td style="font-size:20px;width:40px">${c.flag}</td>
    <td style="font-weight:500">${c.name}</td>
    <td><span class="badge badge-accent2">${c.currency} ${c.currencyName}</span></td>
    <td><button class="btn xs danger" onclick="deleteCountry('${c.id}')">刪除</button></td>
  </tr>`).join('');
  document.getElementById('main-content').innerHTML=`
    <div class="section-head"><h2>🏢 集運倉資料庫</h2><button class="btn primary" onclick="openAddWarehouse()">＋ 新增集運倉</button></div>
    ${whHtml}
    <div class="section-head" style="margin-top:28px"><h2>🌏 國別管理</h2><button class="btn primary" onclick="openOverlay('country')">＋ 新增國別</button></div>
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>旗幟</th><th>國別名稱</th><th>幣別</th><th></th></tr></thead>
      <tbody>${countryRows}</tbody>
    </table></div></div>`;
}
function toggleWhCard(id){document.getElementById('whcard-'+id)?.classList.toggle('open');}
function openAddWarehouse(){
  editingWHId=null;populateCountrySelects();
  ['wh-name','wh-recipient','wh-address','wh-phone','wh-zip','wh-member','wh-url','wh-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('wh-modal-title').textContent='新增集運倉';openOverlay('warehouse');
}
function editWarehouse(id){
  const wh=D.warehouses.find(w=>w.id===id);if(!wh)return;
  editingWHId=id;populateCountrySelects();
  document.getElementById('wh-name').value=wh.name||'';document.getElementById('wh-country').value=wh.country||'';
  document.getElementById('wh-currency').value=wh.currency||'';document.getElementById('wh-recipient').value=wh.recipient||'';
  document.getElementById('wh-address').value=wh.address||'';document.getElementById('wh-phone').value=wh.phone||'';
  document.getElementById('wh-zip').value=wh.zip||'';document.getElementById('wh-member').value=wh.member||'';
  document.getElementById('wh-url').value=wh.url||'';document.getElementById('wh-note').value=wh.note||'';
  document.getElementById('wh-modal-title').textContent='編輯集運倉';openOverlay('warehouse');
}
function saveWarehouse(){
  const wh={id:editingWHId||Date.now(),name:document.getElementById('wh-name').value.trim(),country:document.getElementById('wh-country').value,currency:document.getElementById('wh-currency').value,recipient:document.getElementById('wh-recipient').value.trim(),address:document.getElementById('wh-address').value.trim(),phone:document.getElementById('wh-phone').value.trim(),zip:document.getElementById('wh-zip').value.trim(),member:document.getElementById('wh-member').value.trim(),url:document.getElementById('wh-url').value.trim(),note:document.getElementById('wh-note').value.trim()};
  if(!wh.name){toast('請輸入集運倉名稱');return}
  if(editingWHId){D.warehouses=D.warehouses.map(w=>w.id===editingWHId?wh:w);}else{D.warehouses.push(wh);}
  window._save();closeOverlay('warehouse');renderWarehouses();toast('集運倉資料已儲存');
}
function deleteWarehouse(id){confirmDialog('確定刪除此集運倉？').then(ok=>{if(!ok)return;D.warehouses=D.warehouses.filter(w=>w.id!==id);window._save();renderWarehouses();});}
function saveCountry(){
  const c={id:'C'+Date.now(),flag:document.getElementById('c-flag').value.trim()||'🏳',name:document.getElementById('c-name').value.trim(),currency:document.getElementById('c-currency').value.trim().toUpperCase(),currencyName:document.getElementById('c-currency-name').value.trim()};
  if(!c.name||!c.currency){toast('請填入國別名稱與幣別代號');return}
  D.countries.push(c);window._save();
  ['c-flag','c-name','c-currency','c-currency-name'].forEach(id=>document.getElementById(id).value='');
  closeOverlay('country');renderWarehouses();toast('國別已新增');
}
function deleteCountry(id){
  confirmDialog('確定刪除此國別？').then(ok=>{
    if(!ok)return;
    D.countries=D.countries.filter(c=>c.id!==id);window._save();renderWarehouses();
  });
}

// ===== RATES (history) =====
function renderRates(){
  document.getElementById('topbar-actions').innerHTML='';
  const seen=new Set();
  const currencies=D.countries.filter(c=>{if(seen.has(c.currency))return false;seen.add(c.currency);return true;});
  const curRows=currencies.map(c=>`<div class="form-row">
    <div class="field" style="max-width:160px"><label>${c.currency} ${c.currencyName}</label></div>
    <div class="field" style="max-width:180px"><label>1 ${c.currency} = _____ TWD</label>
      <input type="number" id="rate-${c.currency}" value="${D.rates[c.currency]||''}" step="0.0001" placeholder="e.g. 0.218">
    </div>
  </div>`).join('');
  const histHtml=D.rateHistory.length===0
    ?`<div style="color:var(--text3);font-size:13px;padding:8px 0">還沒有記錄。</div>`
    :[...D.rateHistory].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`
      <div class="rate-hist-row">
        <span class="rdate">${r.date}</span>
        <div class="rvals">${Object.entries(r.rates).map(([k,v])=>`<span class="rval"><b>${k}</b> = ${v}</span>`).join('')}</div>
        ${r.note?`<span style="font-size:11px;color:var(--text3)">${r.note}</span>`:''}
        <button class="btn xs danger" onclick="deleteRateRecord('${r.id}')">刪除</button>
      </div>`).join('');
  const calcOpts=currencies.map(c=>`<option value="${c.currency}">${c.currency} ${c.currencyName}</option>`).join('');
  document.getElementById('main-content').innerHTML=`
    <div class="section-head"><h2 style="font-size:16px;font-weight:600">匯率設定</h2></div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:6px">新增匯率記錄</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:14px">每次信用卡結帳日可分開記錄，包裹和分帳可選擇對應哪一筆</div>
      ${curRows}
      <div class="form-row">
        <div class="field" style="max-width:180px"><label>結帳日期</label><input type="date" id="rate-date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field" style="max-width:200px"><label>備註（選填）</label><input type="text" id="rate-note" placeholder="e.g. 五月韓國訂單"></div>
      </div>
      <button class="btn primary" onclick="saveRateRecord()">儲存這筆匯率</button>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:12px">匯率歷史記錄</div>${histHtml}
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:12px">快速換算</div>
      <div class="form-row">
        <div class="field"><label>幣別</label><select id="calc-cur">${calcOpts}</select></div>
        <div class="field"><label>金額</label><input type="number" id="calc-amt" placeholder="輸入金額" oninput="doCalc()"></div>
        <div class="field"><label>台幣（約）</label><input type="text" id="calc-result" readonly></div>
      </div>
    </div>
    <div class="card" style="border-color:var(--border2)">
      <div style="font-weight:600;margin-bottom:6px">🔧 資料工具</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px">如果換裝置後資料不見，可以嘗試從本機還原</div>
      <button class="btn" onclick="window.restoreFromLocal()">📥 從本機還原舊資料</button>
    </div>`;
}
function saveRateRecord(){
  const seen=new Set();
  const currencies=D.countries.filter(c=>{if(seen.has(c.currency))return false;seen.add(c.currency);return true;});
  const rates={};
  currencies.forEach(c=>{const v=parseFloat(document.getElementById('rate-'+c.currency)?.value)||0;if(v)rates[c.currency]=v;});
  if(!Object.keys(rates).length){toast('請至少填入一個匯率');return}
  const rec={id:'R'+Date.now(),date:document.getElementById('rate-date').value||new Date().toISOString().slice(0,10),rates,note:document.getElementById('rate-note').value.trim()};
  D.rateHistory.push(rec);Object.assign(D.rates,rates);D.rates.date=rec.date;
  window._save();renderRates();toast('匯率記錄已儲存');
}
function deleteRateRecord(id){confirmDialog('刪除此匯率記錄？').then(ok=>{if(!ok)return;D.rateHistory=D.rateHistory.filter(r=>r.id!==id);window._save();renderRates();});}
function doCalc(){
  const cur=document.getElementById('calc-cur').value;
  const amt=parseFloat(document.getElementById('calc-amt').value)||0;
  const rate=getRate(cur,'');
  document.getElementById('calc-result').value=amt>0&&rate?'NT$ '+Math.round(amt*rate).toLocaleString():'';
}

// ===== SPLIT (saved records) =====
function renderSplit(){
  document.getElementById('topbar-actions').innerHTML='';
  const addBtn=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-size:16px;font-weight:600">朋友分帳</h2>
    <button class="btn primary" onclick="openAddSplit()">＋ 新增分帳</button>
  </div>`;
  if(!D.splitRecords.length){
    document.getElementById('main-content').innerHTML=addBtn+`<div class="empty-state"><div class="emoji">👥</div><p>還沒有分帳記錄</p><small>新增分帳，可從包裹品項直接匯入</small></div>`;
    return;
  }
  let html='';
  [...D.splitRecords].reverse().forEach(rec=>{
    const rateRec=rec.rateId?D.rateHistory.find(r=>r.id===rec.rateId):null;
    const rate=getRate(rec.currency,rec.rateId);
    const rateLabel=rateRec?rateRec.date+'匯率':'最新匯率';
    const persons={};
    (rec.items||[]).forEach(it=>{
      const k=it.person||'未分配';
      if(!persons[k])persons[k]={items:[],total:0};
      persons[k].items.push(it);persons[k].total+=it.qty*(it.price||0);
    });
    const grandTotal=(rec.items||[]).reduce((s,it)=>s+it.qty*(it.price||0),0);
    const personSummary=Object.entries(persons).map(([name,d])=>{
      const twd=rate&&d.total?Math.round(d.total*rate):null;
      return`<div class="person-total-row"><span class="pname">${name}</span>
        <div class="pamts"><span class="mono">${d.total.toLocaleString()} ${rec.currency||''}</span>${twd!==null?`<br><span style="font-size:11px">≈ NT$ ${twd.toLocaleString()}</span>`:''}</div>
      </div>`;
    }).join('');
    let detailHtml=`<table style="width:100%;font-size:12px;border-collapse:collapse;margin-top:10px"><thead><tr>
      <th style="text-align:left;padding:4px 8px;color:var(--text3);font-size:11px;border-bottom:1px solid var(--border)">歸屬</th>
      <th style="text-align:left;padding:4px 8px;color:var(--text3);font-size:11px;border-bottom:1px solid var(--border)">品項</th>
      <th style="text-align:center;padding:4px 8px;color:var(--text3);font-size:11px;border-bottom:1px solid var(--border);width:44px">數量</th>
      <th style="text-align:right;padding:4px 8px;color:var(--text3);font-size:11px;border-bottom:1px solid var(--border);width:100px">金額</th>
    </tr></thead><tbody>`;
    (rec.items||[]).forEach(it=>{
      const sub=it.qty*(it.price||0);
      detailHtml+=`<tr>
        <td style="padding:5px 8px;border-bottom:1px solid var(--border);color:var(--accent);font-weight:500">${it.person||'—'}</td>
        <td style="padding:5px 8px;border-bottom:1px solid var(--border)">${it.name||'—'}</td>
        <td style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:center;color:var(--text2)">×${it.qty}</td>
        <td style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;font-family:'DM Mono',monospace">${sub?sub.toLocaleString():''}</td>
      </tr>`;
    });
    if(grandTotal>0){
      const twdTot=rate?Math.round(grandTotal*rate):null;
      detailHtml+=`<tr><td colspan="3" style="padding:6px 8px;text-align:right;font-size:11px;color:var(--text3)">合計</td>
        <td style="padding:6px 8px;font-weight:600;text-align:right;font-family:'DM Mono',monospace">${grandTotal.toLocaleString()} ${rec.currency||''}${twdTot!==null?`<br><span style="font-weight:400;font-size:11px;color:var(--text3)">≈ NT$ ${twdTot.toLocaleString()}</span>`:''}</td>
      </tr>`;
    }
    detailHtml+=`</tbody></table>`;
    html+=`<div class="split-record" id="srec-${rec.id}">
      <div class="split-record-head" onclick="document.getElementById('srec-${rec.id}').classList.toggle('open')">
        <div>
          <div style="font-weight:600;font-size:14px">${rec.title||'分帳記錄'}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${rec.createdAt||''} · ${rec.currency||''} · ${rateLabel}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="text-align:right">
            ${grandTotal>0?`<div style="font-weight:600;font-family:'DM Mono',monospace;font-size:13px">${grandTotal.toLocaleString()} ${rec.currency||''}</div>
            ${rate?`<div style="font-size:11px;color:var(--text3)">≈ NT$ ${Math.round(grandTotal*rate).toLocaleString()}</div>`:''}`:''}
          </div>
          <button class="btn xs ghost" onclick="event.stopPropagation();exportSplitImage('${rec.id}')">📷 存圖</button>
          <button class="btn xs ghost" onclick="event.stopPropagation();editSplitRecord('${rec.id}')">編輯</button>
          <button class="btn xs danger" onclick="event.stopPropagation();deleteSplitRecord('${rec.id}')">刪除</button>
          <span class="split-record-chevron">▼</span>
        </div>
      </div>
      <div class="split-record-body">
        <div style="margin-bottom:10px">${personSummary}</div>
        ${detailHtml}
        ${rec.note?`<div style="margin-top:8px;font-size:12px;color:var(--text3)">📝 ${rec.note}</div>`:''}
      </div>
    </div>`;
  });
  document.getElementById('main-content').innerHTML=addBtn+html;
}

function openAddSplit(){
  editingSplitId=null;
  document.getElementById('split-modal-title').textContent='新增分帳紀錄';
  fillCurrencySelect('se-currency');populateRateSelect('se-rate-id','');
  const parcelOpts=`<option value="">選擇包裹…</option>`+D.parcels.filter(p=>p.lineItems&&p.lineItems.length).map(p=>`<option value="${p.id}">${p.label||p.items||'包裹'}</option>`).join('');
  document.getElementById('se-import-parcel').innerHTML=parcelOpts;
  ['se-title','se-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('se-item-list').innerHTML='';
  document.getElementById('se-preview').innerHTML='';
  addSplitItemRow();addSplitItemRow();
  openOverlay('split-edit');
}
function editSplitRecord(id){
  const rec=D.splitRecords.find(r=>r.id===id);if(!rec)return;
  editingSplitId=id;
  document.getElementById('split-modal-title').textContent='編輯分帳紀錄';
  fillCurrencySelect('se-currency');populateRateSelect('se-rate-id',rec.currency||'');
  const parcelOpts=`<option value="">選擇包裹…</option>`+D.parcels.filter(p=>p.lineItems&&p.lineItems.length).map(p=>`<option value="${p.id}">${p.label||p.items||'包裹'}</option>`).join('');
  document.getElementById('se-import-parcel').innerHTML=parcelOpts;
  document.getElementById('se-title').value=rec.title||'';
  document.getElementById('se-currency').value=rec.currency||'';
  document.getElementById('se-rate-id').value=rec.rateId||'';
  document.getElementById('se-note').value=rec.note||'';
  document.getElementById('se-item-list').innerHTML='';
  document.getElementById('se-preview').innerHTML='';
  (rec.items||[]).forEach(it=>addSplitItemRow(it));
  openOverlay('split-edit');
}
function onSeCurrencyChange(){
  const cur=document.getElementById('se-currency').value;
  populateRateSelect('se-rate-id',cur);
  previewSplit();
}
function importParcelItems(){
  const pid=parseInt(document.getElementById('se-import-parcel').value);
  if(!pid)return;
  const p=D.parcels.find(x=>x.id===pid);if(!p||!p.lineItems)return;
  p.lineItems.forEach(it=>addSplitItemRow({person:'',name:it.name,qty:it.qty,price:it.price}));
  document.getElementById('se-import-parcel').value='';
  if(p.currency&&!document.getElementById('se-currency').value){
    document.getElementById('se-currency').value=p.currency;
    populateRateSelect('se-rate-id',p.currency);
    if(p.rateId)document.getElementById('se-rate-id').value=p.rateId;
  }
  previewSplit();toast(`已匯入 ${p.lineItems.length} 筆品項`);
}
let dragSrc=null;
function addSplitItemRow(data){
  const rid='sei'+(++splitItemRowId);
  const div=document.createElement('div');
  div.style.cssText='display:grid;grid-template-columns:20px 80px 1fr 64px 110px 26px;gap:6px;align-items:center;background:var(--surface2);border-radius:var(--r);padding:7px 8px;cursor:default';
  div.id=rid;
  div.draggable=true;
  div.addEventListener('dragstart',e=>{
    dragSrc=div;
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>div.style.opacity='0.4',0);
  });
  div.addEventListener('dragend',()=>{
    div.style.opacity='1';
    document.querySelectorAll('#se-item-list > div').forEach(r=>r.style.borderTop='');
    dragSrc=null;
    previewSplit();
  });
  div.addEventListener('dragover',e=>{
    e.preventDefault();
    if(dragSrc&&dragSrc!==div){
      document.querySelectorAll('#se-item-list > div').forEach(r=>r.style.borderTop='');
      div.style.borderTop='2px solid var(--accent)';
    }
  });
  div.addEventListener('drop',e=>{
    e.preventDefault();
    if(dragSrc&&dragSrc!==div){
      const list=document.getElementById('se-item-list');
      const kids=[...list.children];
      const srcIdx=kids.indexOf(dragSrc);
      const dstIdx=kids.indexOf(div);
      if(srcIdx<dstIdx) div.after(dragSrc);
      else div.before(dragSrc);
      div.style.borderTop='';
    }
  });
  const s='padding:5px 8px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;font-family:"Noto Sans TC",sans-serif;background:var(--surface);color:var(--text);width:100%';
  div.innerHTML=`<span style="cursor:grab;color:var(--text3);font-size:16px;text-align:center;user-select:none;touch-action:none" title="拖曳排序">⠿</span>
    <input type="text" placeholder="姓名" value="${data?.person||''}" oninput="previewSplit()" style="${s}">
    <input type="text" placeholder="品項" value="${data?.name||''}" oninput="previewSplit()" style="${s}">
    <input type="number" placeholder="數量" value="${data?.qty||1}" min="1" step="1" oninput="previewSplit()" style="${s};text-align:center;font-family:'DM Mono',monospace">
    <input type="number" placeholder="金額" value="${data?.price||''}" min="0" step="1" oninput="previewSplit()" style="${s};text-align:right;font-family:'DM Mono',monospace">
    <button class="item-rm" onclick="document.getElementById('${rid}').remove();previewSplit()">×</button>`;
  document.getElementById('se-item-list').appendChild(div);
}
function getSplitItems(){
  return[...document.getElementById('se-item-list').children].map(row=>{
    const ins=row.querySelectorAll('input');
    return{person:ins[0].value.trim(),name:ins[1].value.trim(),qty:parseFloat(ins[2].value)||1,price:parseFloat(ins[3].value)||0};
  });
}
function previewSplit(){
  const items=getSplitItems();
  const cur=document.getElementById('se-currency').value;
  const rateId=document.getElementById('se-rate-id').value;
  const rate=getRate(cur,rateId);
  const persons={};
  items.filter(it=>it.person&&(it.name||it.price)).forEach(it=>{
    if(!persons[it.person])persons[it.person]={total:0};
    persons[it.person].total+=it.qty*(it.price||0);
  });
  if(!Object.keys(persons).length){document.getElementById('se-preview').innerHTML='';return;}
  let html=`<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:8px"><div style="font-size:12px;color:var(--text2);font-weight:500;margin-bottom:6px">各人合計預覽</div>`;
  Object.entries(persons).forEach(([name,d])=>{
    const twd=rate&&d.total?Math.round(d.total*rate):null;
    html+=`<div class="person-total-row"><span class="pname">${name}</span>
      <div class="pamts"><span class="mono">${d.total.toLocaleString()} ${cur||''}</span>${twd!==null?`<br><span style="font-size:11px">≈ NT$ ${twd.toLocaleString()}</span>`:''}</div>
    </div>`;
  });
  html+=`</div>`;
  document.getElementById('se-preview').innerHTML=html;
}
function saveSplitRecord(){
  const items=getSplitItems().filter(it=>it.name||it.price);
  if(!items.length){toast('請至少新增一筆品項');return}
  const now=new Date().toISOString().slice(0,10);
  const existing=editingSplitId?D.splitRecords.find(r=>r.id===editingSplitId):null;
  const rec={
    id:editingSplitId||'S'+Date.now(),
    title:document.getElementById('se-title').value.trim()||'分帳記錄',
    currency:document.getElementById('se-currency').value,
    rateId:document.getElementById('se-rate-id').value||null,
    items,note:document.getElementById('se-note').value.trim(),
    createdAt:existing?existing.createdAt:now
  };
  if(editingSplitId){D.splitRecords=D.splitRecords.map(r=>r.id===editingSplitId?rec:r);}
  else{D.splitRecords.push(rec);}
  window._save();closeOverlay('split-edit');renderSplit();toast(editingSplitId?'分帳已更新':'分帳記錄已儲存');
}
function deleteSplitRecord(id){confirmDialog('確定刪除此分帳記錄？').then(ok=>{if(!ok)return;D.splitRecords=D.splitRecords.filter(r=>r.id!==id);window._save();renderSplit();});}

function exportSplitImage(id){
  const rec=D.splitRecords.find(r=>r.id===id);if(!rec)return;
  const rate=getRate(rec.currency,rec.rateId);
  const rateRec=rec.rateId?D.rateHistory.find(r=>r.id===rec.rateId):null;
  const rateLabel=rateRec?rateRec.date:D.rates.date||'最新';

  // build persons map
  const persons={};
  (rec.items||[]).forEach(it=>{
    const k=it.person||'未分配';
    if(!persons[k])persons[k]={items:[],total:0};
    persons[k].items.push(it);persons[k].total+=it.qty*(it.price||0);
  });
  const grandTotal=(rec.items||[]).reduce((s,it)=>s+it.qty*(it.price||0),0);
  const personKeys=Object.keys(persons);

  // — layout constants —
  const W=640;
  const PAD=32;
  const COL_W=[200,80,100]; // person, qty, amount  (item name takes rest)
  const ITEM_NAME_W=W-PAD*2-COL_W[0]-COL_W[1]-COL_W[2];
  const ROW_H=36;
  const HEAD_H=80;
  const PERSON_BLOCK_H=personKeys.length*(ROW_H+4)+16;
  const DIVIDER=1;
  const TABLE_HEAD_H=32;
  const ITEMS_H=(rec.items||[]).length*ROW_H+TABLE_HEAD_H+ROW_H; // rows + header + total row
  const NOTE_H=rec.note?36:0;
  const FOOTER_H=40;
  const H=HEAD_H+16+PERSON_BLOCK_H+16+DIVIDER+8+TABLE_HEAD_H+(rec.items||[]).length*ROW_H+ROW_H+NOTE_H+FOOTER_H+PAD;

  const canvas=document.createElement('canvas');
  canvas.width=W*2;canvas.height=H*2; // retina
  const ctx=canvas.getContext('2d');
  ctx.scale(2,2);

  // helpers
  const C={bg:'#f5f3ef',surface:'#ffffff',border:'#ddd9d2',text:'#1a1814',text2:'#6b6760',text3:'#9e9b95',accent:'#2d5a27',accentBg:'#eef4ed',surface2:'#f0ede8',warn:'#8a6914'};
  function rect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    if(r){ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);}
    else{ctx.rect(x,y,w,h);}
    ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
  }
  function txt(t,x,y,size,color,align,weight,maxW){
    ctx.font=`${weight||400} ${size}px 'Noto Sans TC',sans-serif`;
    ctx.fillStyle=color||C.text;
    ctx.textAlign=align||'left';
    ctx.textBaseline='middle';
    if(maxW&&ctx.measureText(t).width>maxW){
      while(ctx.measureText(t+'…').width>maxW&&t.length>0)t=t.slice(0,-1);
      t+=t.length?'…':'';
    }
    ctx.fillText(t,x,y);
  }
  function line(x1,y1,x2,y2,color){
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=color||C.border;ctx.lineWidth=1;ctx.stroke();
  }

  // background
  rect(0,0,W,H,0,C.bg);
  // card
  rect(PAD-8,8,W-PAD*2+16,H-16,12,C.surface,C.border);

  let y=PAD;

  // — header —
  txt('📋',PAD,y+14,18);
  txt(rec.title||'分帳記錄',PAD+28,y+14,17,C.text,'left',600);
  txt(`${rec.createdAt||''} · 匯率 ${rateLabel}`,PAD+28,y+34,11,C.text3);
  // grand total top-right
  if(grandTotal>0){
    txt(`${grandTotal.toLocaleString()} ${rec.currency||''}`,W-PAD,y+14,15,C.text,'right',600);
    if(rate) txt(`≈ NT$ ${Math.round(grandTotal*rate).toLocaleString()}`,W-PAD,y+34,11,C.text3,'right');
  }

  y+=HEAD_H-8;
  line(PAD,y,W-PAD,y,C.border);
  y+=16;

  // — person summary —
  txt('各人合計',PAD,y,11,C.text3,'left',500);
  y+=16;
  personKeys.forEach(name=>{
    const d=persons[name];
    const twd=rate&&d.total?Math.round(d.total*rate):null;
    rect(PAD,y,W-PAD*2,ROW_H,8,C.accentBg);
    txt(name,PAD+12,y+ROW_H/2,13,C.accent,'left',500);
    const amtStr=`${d.total.toLocaleString()} ${rec.currency||''}${twd!==null?' ≈ NT$ '+twd.toLocaleString():''}`;
    txt(amtStr,W-PAD-10,y+ROW_H/2,12,C.text2,'right');
    y+=ROW_H+4;
  });

  y+=12;
  line(PAD,y,W-PAD,y,C.border);
  y+=12;

  // — detail table header —
  const cols_x=[PAD, PAD+COL_W[0], PAD+COL_W[0]+ITEM_NAME_W, PAD+COL_W[0]+ITEM_NAME_W+COL_W[1]];
  rect(PAD,y,W-PAD*2,TABLE_HEAD_H,0,C.surface2);
  txt('歸屬',cols_x[0]+8,y+TABLE_HEAD_H/2,11,C.text3,'left',500);
  txt('品項',cols_x[1]+8,y+TABLE_HEAD_H/2,11,C.text3,'left',500);
  txt('數量',cols_x[2]+COL_W[1]/2,y+TABLE_HEAD_H/2,11,C.text3,'center',500);
  txt('金額',W-PAD-8,y+TABLE_HEAD_H/2,11,C.text3,'right',500);
  y+=TABLE_HEAD_H;

  // — rows —
  (rec.items||[]).forEach((it,i)=>{
    const sub=it.qty*(it.price||0);
    if(i%2===1) rect(PAD,y,W-PAD*2,ROW_H,0,'#faf9f6');
    line(PAD,y,W-PAD,y,C.border);
    txt(it.person||'—',cols_x[0]+8,y+ROW_H/2,12,C.accent,'left',500);
    txt(it.name||'—',cols_x[1]+8,y+ROW_H/2,12,C.text,'left',400,ITEM_NAME_W-12);
    txt('×'+it.qty,cols_x[2]+COL_W[1]/2,y+ROW_H/2,12,C.text2,'center');
    txt(sub?sub.toLocaleString():'',W-PAD-8,y+ROW_H/2,12,C.text,'right');
    y+=ROW_H;
  });

  // — total row —
  line(PAD,y,W-PAD,y,C.border);
  rect(PAD,y,W-PAD*2,ROW_H,0,C.surface2);
  txt('合計',W-PAD-8-120,y+ROW_H/2,12,C.text3,'right');
  if(grandTotal>0){
    const twdTot=rate?Math.round(grandTotal*rate):null;
    const totStr=`${grandTotal.toLocaleString()} ${rec.currency||''}${twdTot!==null?' ≈ NT$ '+twdTot.toLocaleString():''}`;
    txt(totStr,W-PAD-8,y+ROW_H/2,12,C.text,'right',600);
  }
  y+=ROW_H;

  // — note —
  if(rec.note){
    y+=8;
    txt('📝 '+rec.note,PAD+4,y+14,11,C.text3);
    y+=NOTE_H;
  }

  // — footer —
  y+=12;
  txt('集運倉管理系統',W/2,y+14,10,C.text3,'center');

  // — 偵測裝置，決定呈現方式 —
  const dataUrl=canvas.toDataURL('image/png');
  const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  // 圖片預覽 modal（手機長按存、桌機可選下載）
  document.getElementById('imgpreview-img').src=dataUrl;
  document.getElementById('imgpreview-hint').textContent=isMobile?'📱 長按圖片即可儲存到相簿':'電腦：右鍵另存圖片，或點下載按鈕';
  const dlLink=document.getElementById('imgpreview-dl');
  dlLink.href=dataUrl;
  dlLink.download=`分帳_${rec.title||'記錄'}_${rec.createdAt||''}.png`;
  dlLink.style.display=isMobile?'none':'inline';
  openOverlay('imgpreview');
}
