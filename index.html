<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集運倉管理系統</title>
<link rel="icon" href="https://fav.farm/📦">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ef;--surface:#fff;--surface2:#f0ede8;--border:#ddd9d2;--border2:#c8c4bc;
  --text:#1a1814;--text2:#6b6760;--text3:#9e9b95;
  --accent:#2d5a27;--accent-bg:#eef4ed;--accent2:#8b5e3c;--accent2-bg:#f5ede5;
  --danger:#b03a2e;--danger-bg:#fdf0ee;--warn:#8a6914;--warn-bg:#fdf6e3;
  --ok:#2d5a27;--ok-bg:#eef4ed;--r:6px;--rl:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;line-height:1.5}
.app-shell{display:flex;flex-direction:column;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
/* ALERT BAR */
.alert-bar{display:none;background:var(--warn-bg);border-bottom:1px solid #e8d080;padding:8px 24px;font-size:12px;color:var(--warn);gap:12px;align-items:center;flex-wrap:wrap}
.alert-bar.show{display:flex}
.alert-chip{background:#fff;border:1px solid var(--warn);border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap;font-size:11px}
.alert-chip:hover{background:var(--warn);color:#fff}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;border-bottom:1px solid var(--border)}
.header-logo{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.header-logo h1{font-size:15px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.topbar-actions{display:flex;gap:8px;flex-shrink:0}
/* 頂部導覽（電腦版） */
.top-nav{display:none;padding:0 16px;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface)}
.top-nav-item{display:flex;align-items:center;gap:6px;padding:10px 12px;border:none;background:none;cursor:pointer;font-size:13px;font-family:'Noto Sans TC',sans-serif;color:var(--text2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;border-radius:0;font-weight:400}
.top-nav-item:hover{color:var(--text);background:var(--surface2)}
.top-nav-item.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.top-nav-item .icon{font-size:14px}
/* 底部導覽（手機版） */
.bottom-nav{display:flex;background:var(--surface);border-top:1px solid var(--border);position:sticky;bottom:0;z-index:50;box-shadow:0 -1px 8px rgba(0,0,0,.06)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;border:none;background:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;color:var(--text3);transition:all .15s;min-height:56px}
.bnav-item:hover{background:var(--surface2)}
.bnav-item.active{color:var(--accent)}
.bnav-icon{font-size:18px;line-height:1}
.bnav-label{font-size:10px;font-weight:500;white-space:nowrap}
.bnav-item.active .bnav-label{color:var(--accent)}
/* 電腦版：頂部導覽顯示，底部隱藏 */
@media(min-width:700px){
  .header-top{padding:0 24px;height:52px}
  .header-logo h1{font-size:15px;font-weight:700}
  .top-nav{display:flex}
  .bottom-nav{display:none}
  .content{padding:24px 28px 24px}
}
/* 內容底部留空給底部導覽列（手機） */
.content{padding:16px 16px 80px;max-width:1100px;margin:0 auto}
.main{flex:1}.content{padding:24px 28px;max-width:1100px;margin:0 auto}
@media(max-width:600px){.content{padding:16px}}
/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat-card .s-label{font-size:11px;color:var(--text3);margin-bottom:6px;letter-spacing:.04em}
.stat-card .s-val{font-size:26px;font-weight:700;line-height:1}
.stat-card .s-sub{font-size:11px;color:var(--text3);margin-top:4px}
/* BUTTONS */
.btn{padding:8px 14px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:13px;font-family:'Noto Sans TC',sans-serif;color:var(--text);transition:all .12s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:400}
.btn:hover{background:var(--surface2)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{background:#245220}
.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.xs{padding:3px 7px;font-size:11px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--surface2);border-color:var(--border)}
/* FORMS */
.form-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:100px}
.field label{font-size:12px;color:var(--text2);font-weight:500}
.field input,.field select,.field textarea{padding:8px 11px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;font-family:'Noto Sans TC',sans-serif;background:var(--surface);color:var(--text);width:100%;transition:border .12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,90,39,.1)}
.field textarea{resize:vertical;min-height:72px}.field input[readonly]{background:var(--surface2);cursor:default}
/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-country{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.badge-ok{background:var(--ok-bg);color:var(--ok)}.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}.badge-gray{background:var(--surface2);color:var(--text3)}
.badge-accent2{background:var(--accent2-bg);color:var(--accent2)}
/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--text3);font-weight:500;font-size:11px;letter-spacing:.05em;border-bottom:1px solid var(--border);text-transform:uppercase}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
.mono{font-family:'DM Mono',monospace;font-size:12px}
/* MODALS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--rl);padding:24px;width:90%;max-width:580px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);padding:0 4px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
/* SECTION HEADER */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-head h2{font-size:16px;font-weight:600}
/* WAREHOUSE CARD — collapsible */
.wh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:12px}
.wh-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden}
.wh-card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none;transition:background .12s}
.wh-card-head:hover{background:var(--surface2)}
.wh-card-name{font-size:14px;font-weight:600}
.wh-card-sub{font-size:11px;color:var(--text3);margin-top:1px}
.wh-card-chevron{font-size:11px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.wh-card-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.wh-card.open .wh-card-body{display:block}
.wh-card.open .wh-card-chevron{transform:rotate(180deg)}
.copy-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.copy-row:hover{border-color:var(--accent);background:var(--accent-bg)}
.copy-row:hover .copy-hint{opacity:1}
.copy-row-text{font-size:12px;line-height:1.5;flex:1;word-break:break-all}
.copy-hint{font-size:10px;color:var(--accent);opacity:0;transition:opacity .12s;white-space:nowrap;font-weight:500}
@keyframes copyFlash{0%,100%{background:var(--surface2)}50%{background:var(--accent-bg)}}
.copy-flash{animation:copyFlash .6s ease}
/* STATUS FLOW */
.status-flow{display:flex;align-items:center;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.status-step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:76px;cursor:pointer}
.status-step .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--border2);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;z-index:1;position:relative}
.status-step .dot:hover{border-color:var(--accent)}
.status-step.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.status-step.current .dot{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,90,39,.15);background:var(--accent-bg)}
.status-step .slabel{font-size:10px;color:var(--text3);text-align:center;white-space:nowrap}
.status-step.done .slabel,.status-step.current .slabel{color:var(--accent);font-weight:500}
.status-line{flex:1;height:2px;background:var(--border);margin-top:-16px;min-width:12px}
.status-line.done{background:var(--accent)}
/* PARCEL CARD */
.parcel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .12s}
.parcel-card:hover{border-color:var(--border2)}
.parcel-card.status-done{opacity:.65}
.parcel-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.parcel-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-bottom:8px}
.pf{display:flex;flex-direction:column;gap:2px}
.pf-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.pf-val{font-size:13px}.pf-val.mono{font-family:'DM Mono',monospace;font-size:12px}
/* FILTER */
.status-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sfilter{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;color:var(--text2);transition:all .12s}
.sfilter:hover{border-color:var(--border2);background:var(--surface2)}
.sfilter.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ITEM ROWS */
.item-row{display:grid;grid-template-columns:1fr 64px 110px 26px;gap:6px;align-items:center;background:var(--surface2);border-radius:var(--r);padding:7px 8px}
.item-row input{padding:5px 8px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;font-family:'Noto Sans TC',sans-serif;background:var(--surface);color:var(--text);width:100%}
.item-row input:focus{outline:none;border-color:var(--accent)}
.item-row input.price{font-family:'DM Mono',monospace;text-align:right}
.item-rm{width:24px;height:24px;border:none;background:none;cursor:pointer;color:var(--text3);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:var(--r)}
.item-rm:hover{background:var(--danger-bg);color:var(--danger)}
/* RATES */
.rate-hist-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface2);border-radius:var(--r);margin-bottom:6px;font-size:13px;flex-wrap:wrap}
.rate-hist-row .rdate{font-size:11px;color:var(--text3);min-width:80px;flex-shrink:0}
.rate-hist-row .rvals{flex:1;display:flex;gap:12px;flex-wrap:wrap}
.rate-hist-row .rval{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2)}
.rate-hist-row .rval b{color:var(--text);font-weight:600}
/* SPLIT RECORD */
.split-record{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.split-record-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;transition:background .12s}
.split-record-head:hover{background:var(--surface2)}
.split-record-body{display:none;padding:0 16px 14px}
.split-record.open .split-record-body{display:block}
.split-record-chevron{font-size:11px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.split-record.open .split-record-chevron{transform:rotate(180deg)}
.person-total-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:var(--r);margin-bottom:4px;background:var(--surface2)}
.person-total-row .pname{font-weight:500}
.person-total-row .pamts{font-size:12px;color:var(--text2);text-align:right}
/* TRACKING */
.tracking-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-family:'DM Mono',monospace}
.tracking-chip.has{background:var(--ok-bg);color:var(--ok)}
.tracking-chip.empty{background:var(--warn-bg);color:var(--warn);cursor:pointer}
.tracking-chip.empty:hover{background:var(--warn);color:#fff}
/* MISC */
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-state .emoji{font-size:36px;margin-bottom:12px}
.empty-state p{font-size:14px;margin-bottom:4px;color:var(--text2)}
.empty-state small{font-size:12px;color:var(--text3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:9999;transition:transform .25s ease;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.tag-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:12px;margin:2px}
.divider{height:1px;background:var(--border);margin:14px 0}
.info-pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.info-pill{font-size:12px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.info-pill b{color:var(--text);font-weight:500}
@media(max-width:768px){.stat-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<!-- 登入畫面 -->
<div id="login-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:999;align-items:center;justify-content:center;padding:24px;overflow-y:auto">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:32px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px">
      <span style="font-size:28px">📦</span>
      <div>
        <div style="font-size:17px;font-weight:700">集運倉管理</div>
        <div style="font-size:11px;color:var(--text3)">海外購物追蹤系統</div>
      </div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="field" style="margin-bottom:8px">
      <label>密碼</label>
      <input type="password" id="login-pw" placeholder="至少 6 個字元" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" style="font-size:12px;color:var(--danger);min-height:18px;margin-bottom:12px"></div>
    <button class="btn primary" id="login-btn" onclick="doLogin()" style="width:100%;justify-content:center;margin-bottom:8px">登入</button>
    <button class="btn" onclick="doRegister()" style="width:100%;justify-content:center;font-size:12px;color:var(--text2);margin-bottom:6px">第一次使用？建立帳號</button>
    <button class="btn ghost" onclick="showForgotPassword()" style="width:100%;justify-content:center;font-size:11px;color:var(--text3)">忘記密碼？</button>
    <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:10px;line-height:1.6">建立帳號後，你的所有資料會自動雲端同步<br>換裝置登入也能看到同樣的內容</div>
  </div>
</div>

<!-- 忘記密碼 modal -->
<div class="overlay" id="overlay-forgot" style="z-index:1000">
  <div class="modal" style="max-width:360px">
    <div class="modal-header">
      <h3>重設密碼</h3>
      <button class="modal-close" onclick="closeOverlay('forgot')">✕</button>
    </div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">輸入你的 Email，我們會寄一封重設密碼的連結給你。</p>
    <div class="field" style="margin-bottom:8px">
      <label>Email</label>
      <input type="email" id="forgot-email" placeholder="your@email.com">
    </div>
    <div id="forgot-msg" style="font-size:12px;min-height:18px;margin-bottom:10px"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeOverlay('forgot')">取消</button>
      <button class="btn primary" onclick="doForgotPassword()">寄出重設信</button>
    </div>
  </div>
</div>

<div class="app-shell" id="app-shell" style="display:none;flex-direction:column;min-height:100vh">
  <header class="header">
    <div class="alert-bar" id="alert-bar"></div>
    <div class="header-top">
      <div class="header-logo">
        <span style="font-size:18px">📦</span>
        <div><h1 id="page-title-header">包裹管理</h1></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="save-status" style="font-size:11px;color:var(--text3)"></span>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
    </div>
    <!-- 電腦版頂部導覽 -->
    <nav class="top-nav" id="top-nav">
      <button class="top-nav-item active" onclick="nav('parcels')" id="tnav-parcels"><span class="icon">📬</span>包裹管理</button>
      <button class="top-nav-item" onclick="nav('shipments')" id="tnav-shipments"><span class="icon">🚢</span>出貨訂單</button>
      <button class="top-nav-item" onclick="nav('warehouses')" id="tnav-warehouses"><span class="icon">🏢</span>集運倉與國別</button>
      <button class="top-nav-item" onclick="nav('rates')" id="tnav-rates"><span class="icon">💱</span>匯率設定</button>
      <button class="top-nav-item" onclick="nav('split')" id="tnav-split"><span class="icon">👥</span>朋友分帳</button>
      <div style="flex:1"></div>
      <button class="top-nav-item" onclick="doLogout()" style="color:var(--text3)"><span class="icon">🚪</span>登出</button>
    </nav>
  </header>
  <div class="main"><div class="content" id="main-content"></div></div>
  <!-- 底部導覽列 -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="bnav-item active" onclick="nav('parcels')" id="bnav-parcels">
      <span class="bnav-icon">📬</span><span class="bnav-label">包裹</span>
    </button>
    <button class="bnav-item" onclick="nav('shipments')" id="bnav-shipments">
      <span class="bnav-icon">🚢</span><span class="bnav-label">出貨</span>
    </button>
    <button class="bnav-item" onclick="nav('warehouses')" id="bnav-warehouses">
      <span class="bnav-icon">🏢</span><span class="bnav-label">集運倉</span>
    </button>
    <button class="bnav-item" onclick="nav('rates')" id="bnav-rates">

<script type="module">
// ===== FIREBASE =====
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig={
  apiKey:'AIzaSyAleSSd64K1IQha0KNoYfANjlaPivLOcrI',
  authDomain:'my--logi.firebaseapp.com',
  projectId:'my--logi',
  storageBucket:'my--logi.firebasestorage.app',
  messagingSenderId:'920452447995',
  appId:'1:920452447995:web:fa4700d9013fd124f03a5e'
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let currentUser=null;
let saveTimer=null;

// ===== DATA =====
const DEF={
  countries:[
    {id:'JP',name:'日本',flag:'🇯🇵',currency:'JPY',currencyName:'日圓'},
    {id:'KR',name:'韓國',flag:'🇰🇷',currency:'KRW',currencyName:'韓圓'},
    {id:'TW',name:'台灣',flag:'🇹🇼',currency:'TWD',currencyName:'新台幣'},
  ],
  warehouses:[],parcels:[],shipments:[],
  rateHistory:[],
  rates:{JPY:0.218,KRW:0.023,USD:32.5,GBP:41.2,EUR:35.8,CNY:4.5,date:''},
  splitRecords:[]
};
let D=JSON.parse(JSON.stringify(DEF));

// debounced save
window._save=function(){
  localStorage.setItem('wms_v3',JSON.stringify(D));
  clearTimeout(saveTimer);
  setSaveStatus('saving');
  saveTimer=setTimeout(()=>saveToCloud(),800);
};

function setSaveStatus(status){
  const el=document.getElementById('save-status');
  if(!el)return;
  if(status==='saving'){el.textContent='儲存中…';el.style.color='var(--text3)';}
  else if(status==='saved'){el.textContent='✓ 已同步';el.style.color='var(--ok)';}
  else if(status==='error'){el.textContent='⚠ 同步失敗';el.style.color='var(--danger)';}
}

async function saveToCloud(){
  if(!currentUser){setSaveStatus('error');return;}
  try{
    await setDoc(doc(db,'users',currentUser.uid),{data:D,updatedAt:new Date().toISOString()});
    setSaveStatus('saved');
  }catch(e){console.error('雲端存檔失敗',e);setSaveStatus('error');}
}

async function loadFromCloud(){
  if(!currentUser)return;
  try{
    const snap=await getDoc(doc(db,'users',currentUser.uid));
    if(snap.exists()&&snap.data().data){
      D=snap.data().data;
      if(!D.countries)D.countries=DEF.countries;
      if(!D.rateHistory)D.rateHistory=[];
      if(!D.splitRecords)D.splitRecords=[];
      if(!D.rates)D.rates=DEF.rates;
    }else{
      // 雲端沒資料，嘗試從 localStorage 搬移
      const local=localStorage.getItem('wms_v3')||localStorage.getItem('wms_v2');
      if(local){
        try{
          const parsed=JSON.parse(local);
          if(parsed&&(parsed.parcels||parsed.warehouses)){
            D=parsed;
            if(!D.countries)D.countries=DEF.countries;
            if(!D.rateHistory)D.rateHistory=[];
            if(!D.splitRecords)D.splitRecords=[];
            if(!D.rates)D.rates=DEF.rates;
            await saveToCloud();
            setSaveStatus('saved');
          }
        }catch(e){}
      }
    }
  }catch(e){console.error('載入失敗',e);}
}

window.restoreFromLocal=async function(){
  const local=localStorage.getItem('wms_v3')||localStorage.getItem('wms_v2');
  if(!local){toast('本機沒有找到舊資料');return;}
  try{
    const parsed=JSON.parse(local);
    if(parsed&&(parsed.parcels||parsed.warehouses)){
      D=parsed;
      if(!D.countries)D.countries=DEF.countries;
      if(!D.rateHistory)D.rateHistory=[];
      if(!D.splitRecords)D.splitRecords=[];
      if(!D.rates)D.rates=DEF.rates;
      await saveToCloud();
      window.nav('parcels');
      toast('✓ 本機資料已還原！');
    }else{toast('找不到有效資料');}
  }catch(e){toast('還原失敗：'+e.message);}
};

// ===== AUTH FUNCTIONS (exposed to window) =====
window.doLogin=async function(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const btn=document.getElementById('login-btn');
  const err=document.getElementById('login-err');
  if(!email||!pw){err.textContent='請填入 Email 和密碼';return;}
  btn.textContent='登入中…';btn.disabled=true;err.textContent='';
  try{
    await signInWithEmailAndPassword(auth,email,pw);
  }catch(e){
    err.textContent=e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'?'Email 或密碼錯誤':e.message;
    btn.textContent='登入';btn.disabled=false;
  }
};

window.doRegister=async function(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const err=document.getElementById('login-err');
  if(!email||!pw){err.textContent='請填入 Email 和密碼';return;}
  if(pw.length<6){err.textContent='密碼至少 6 個字元';return;}
  try{
    await createUserWithEmailAndPassword(auth,email,pw);
    err.style.color='var(--ok)';err.textContent='註冊成功！';
  }catch(e){
    err.style.color='var(--danger)';
    err.textContent=e.code==='auth/email-already-in-use'?'此 Email 已註冊過':e.message;
  }
};

window.doForgotPassword=async function(){
  const email=document.getElementById('forgot-email').value.trim();
  const msg=document.getElementById('forgot-msg');
  if(!email){msg.style.color='var(--danger)';msg.textContent='請輸入 Email';return;}
  msg.style.color='var(--text3)';msg.textContent='寄送中…';
  try{
    await sendPasswordResetEmail(auth,email);
    msg.style.color='var(--ok)';msg.textContent='✓ 已寄出！請檢查信箱點連結重設密碼。';
  }catch(e){
    msg.style.color='var(--danger)';msg.textContent='寄送失敗：'+e.message;
  }
};

window.doLogout=async function(){
  currentUser=null;
  D=JSON.parse(JSON.stringify(DEF));
  await signOut(auth);
  showLoginScreen();
  toast('已登出');
};

// ===== INIT =====
onAuthStateChanged(auth,async user=>{
  if(user){
    currentUser=user;
    await loadFromCloud();
    showAppShell();
    nav('parcels');
  }else{
    showLoginScreen();
  }
});

// ===== STATE =====
let currentPage='parcels';
let editingWHId=null,editingTrackId=null,editingParcelId=null,editingSplitId=null;
let selectedParcelIds=[];
let parcelFilter='active';
let itemRowId=0,splitItemRowId=0;

// ===== NAV =====
const PAGE_TITLES={parcels:'包裹管理',shipments:'出貨訂單',warehouses:'集運倉與國別',rates:'匯率設定',split:'朋友分帳'};
function nav(page){
  currentPage=page;
  // 同步底部導覽
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.remove('active'));
  const bBtn=document.getElementById('bnav-'+page);
  if(bBtn)bBtn.classList.add('active');
  // 同步頂部導覽
  document.querySelectorAll('.top-nav-item').forEach(b=>b.classList.remove('active'));
  const tBtn=document.getElementById('tnav-'+page);
  if(tBtn)tBtn.classList.add('active');
  // 更新頁面標題
  const titleEl=document.getElementById('page-title-header');
  if(titleEl)titleEl.textContent=PAGE_TITLES[page]||'';
  ({parcels:renderParcels,shipments:renderShipments,warehouses:renderWarehouses,rates:renderRates,split:renderSplit})[page]?.();
}

// ===== ALERT BAR =====
function updateAlertBar(){
  const bar=document.getElementById('alert-bar');
  const urgent=D.parcels.filter(p=>{
    if(p.status==='received'||p.status==='shipping_to_tw')return false;
    const d=daysLeft(p.deadline);
    return d!==null&&d<=7;
  });
  if(!urgent.length){bar.classList.remove('show');return;}
  bar.classList.add('show');
  bar.innerHTML=`<b>⚠ 出倉提醒</b>`+urgent.map(p=>{
    const d=daysLeft(p.deadline);
    const name=p.label||p.items||'包裹';
    return`<span class="alert-chip" onclick="parcelFilter='active';nav('parcels')">${name} — ${d<0?'逾期'+Math.abs(d)+'天':d+'天後到期'}</span>`;
  }).join('');
}

// ===== HELPERS =====
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

let _confirmResolve=null;
function confirmDialog(msg,title,okText){
  return new Promise(resolve=>{
    _confirmResolve=resolve;
    document.getElementById('confirm-title').textContent=title||'確認';
    document.getElementById('confirm-msg').textContent=msg||'確定嗎？';
    const okBtn=document.getElementById('confirm-ok-btn');
    okBtn.textContent=okText||'確定';
    okBtn.className=title==='登出'?'btn':'btn danger';
    document.getElementById('overlay-confirm').classList.add('open');
  });
}
function confirmResolve(val){
  document.getElementById('overlay-confirm').classList.remove('open');
  if(_confirmResolve){_confirmResolve(val);_confirmResolve=null;}
}
function openOverlay(id){document.getElementById('overlay-'+id).classList.add('open')}
function closeOverlay(id){document.getElementById('overlay-'+id).classList.remove('open')}
function getCountry(id){return D.countries.find(c=>c.id===id)}
function daysLeft(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/86400000)}
function deadlineBadge(d){
  if(!d)return'';const n=daysLeft(d);
  if(n<0)return`<span class="badge badge-danger">逾期${Math.abs(n)}天</span>`;
  if(n<=3)return`<span class="badge badge-danger">${n}天到期</span>`;
  if(n<=7)return`<span class="badge badge-warn">${n}天</span>`;
  return`<span class="badge badge-ok">${n}天</span>`;
}
function copyText(text,el){
  navigator.clipboard.writeText(text).then(()=>{toast('已複製！');if(el){el.classList.add('copy-flash');setTimeout(()=>el.classList.remove('copy-flash'),700);}})
  .catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('已複製！');});
}
function makeCopyRow(text,label){
  const esc=text.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
  return`<div class="copy-row" onclick="copyText('${esc}',this)"><div class="copy-row-text">${text.replace(/\n/g,'<br>')}</div><span class="copy-hint">點擊複製</span></div>`;
}
function populateCountrySelects(){
  const opts=`<option value="">選擇國別</option>`+D.countries.map(c=>`<option value="${c.id}">${c.flag} ${c.name}</option>`).join('');
  ['s-country','wh-country'].forEach(id=>{const el=document.getElementById(id);if(el){const v=el.value;el.innerHTML=opts;if(v)el.value=v;}});
}
function fillCurrencySelect(selId){
  const seen=new Set();
  const opts=`<option value="">— 不指定 —</option>`+D.countries.filter(c=>{if(seen.has(c.currency))return false;seen.add(c.currency);return true;}).map(c=>`<option value="${c.currency}">${c.currency} ${c.currencyName}</option>`).join('');
  const el=document.getElementById(selId);if(!el)return;const v=el.value;el.innerHTML=opts;if(v)el.value=v;
}
function getRate(currency,rateId){
  if(!currency)return 0;
  if(rateId){const r=D.rateHistory.find(x=>x.id==rateId);if(r&&r.rates[currency])return r.rates[currency];}
  if(D.rateHistory.length){
    const sorted=[...D.rateHistory].sort((a,b)=>b.date.localeCompare(a.date));
    for(const r of sorted){if(r.rates[currency])return r.rates[currency];}
  }
  return D.rates[currency]||0;
}
function populateRateSelect(selId,currency){
  const el=document.getElementById(selId);if(!el)return;
  const v=el.value;
  const opts=D.rateHistory
    .filter(r=>!currency||r.rates[currency])
    .sort((a,b)=>b.date.localeCompare(a.date))
    .map(r=>`<option value="${r.id}">${r.date}${r.note?' · '+r.note:''} (1${currency?currency:''}=${r.rates[currency]||'?'})</option>`).join('');
  el.innerHTML=`<option value="">使用最新匯率</option>`+opts;
  if(v)el.value=v;
}

// ===== STATUSES =====
const STATUSES=[
  {key:'ordered',label:'已下單',icon:'🛒'},
  {key:'shipping_to_wh',label:'寄往集運倉',icon:'✈️'},
  {key:'in_wh',label:'已入倉',icon:'🏢'},
  {key:'shipping_to_tw',label:'出貨中',icon:'🚢'},
  {key:'received',label:'已收到',icon:'✓'},
];
const STATUS_IDX=Object.fromEntries(STATUSES.map((s,i)=>[s.key,i]));

// ===== PARCELS =====
function renderParcels(){
  document.getElementById('topbar-actions').innerHTML='';
  const addBtn=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-size:16px;font-weight:600">包裹管理</h2>
    <button class="btn primary" onclick="openAddParcel()">＋ 新增包裹</button>
  </div>`;
  updateAlertBar();
  const all=D.parcels;
  const active=all.filter(p=>p.status!=='received');
  const received=all.filter(p=>p.status==='received');
  const urgent=active.filter(p=>{const d=daysLeft(p.deadline);return d!==null&&d<=7&&p.status==='in_wh';}).length;
  const statsHtml=`<div class="stat-grid">
    <div class="stat-card"><div class="s-label">追蹤中</div><div class="s-val">${active.length}</div><div class="s-sub">進行中</div></div>
    <div class="stat-card"><div class="s-label">已完結</div><div class="s-val">${received.length}</div></div>
    <div class="stat-card" style="${urgent>0?'border-color:var(--warn);background:var(--warn-bg)':''}">
      <div class="s-label">⚠ 即將到期</div><div class="s-val" style="${urgent>0?'color:var(--warn)':''}">${urgent}</div><div class="s-sub">在倉7天內</div></div>
    <div class="stat-card"><div class="s-label">全部包裹</div><div class="s-val">${all.length}</div></div>
  </div>`;
  const filterHtml=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <select onchange="window._setFilter(this.value)" style="padding:8px 12px;border:1px solid var(--border2);border-radius:999px;font-size:13px;font-family:'Noto Sans TC',sans-serif;background:var(--surface);color:var(--text);cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:28px;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 12 12%22><path fill=%22%239e9b95%22 d=%22M6 8L1 3h10z%22/></svg>');background-repeat:no-repeat;background-position:right 10px center">
      <option value="active" ${parcelFilter==='active'?'selected':''}>全部進行中 (${active.length})</option>
      <option value="ordered" ${parcelFilter==='ordered'?'selected':''}>🛒 已下單 (${all.filter(p=>p.status==='ordered').length})</option>
      <option value="shipping_to_wh" ${parcelFilter==='shipping_to_wh'?'selected':''}>✈️ 寄往集運倉 (${all.filter(p=>p.status==='shipping_to_wh').length})</option>
      <option value="in_wh" ${parcelFilter==='in_wh'?'selected':''}>🏢 已入倉 (${all.filter(p=>p.status==='in_wh').length})</option>
      <option value="shipping_to_tw" ${parcelFilter==='shipping_to_tw'?'selected':''}>🚢 出貨中 (${all.filter(p=>p.status==='shipping_to_tw').length})</option>
      <option value="received" ${parcelFilter==='received'?'selected':''}>✓ 已收到 (${received.length})</option>
      <option value="all" ${parcelFilter==='all'?'selected':''}>全部 (${all.length})</option>
    </select>
  </div>`;
  const singleStatuses=['ordered','shipping_to_wh','in_wh','shipping_to_tw','received'];
  let shown=parcelFilter==='active'?active:parcelFilter==='received'?received:parcelFilter==='all'?all:singleStatuses.includes(parcelFilter)?all.filter(p=>p.status===parcelFilter):active;
  let cardsHtml='';
  if(!shown.length){
    cardsHtml=`<div class="empty-state"><div class="emoji">📭</div><p>${parcelFilter==='received'?'還沒有完結的包裹':parcelFilter==='all'?'還沒有任何包裹':parcelFilter==='active'?'目前沒有進行中的包裹':'這個狀態目前沒有包裹'}</p><small>點右上角「新增包裹」開始記錄</small></div>`;
  }else{
    shown.forEach(p=>{
      const wh=D.warehouses.find(w=>w.id===p.whId);
      const c=wh?getCountry(wh.country):null;
      const si=STATUS_IDX[p.status]??0;
      const rate=getRate(p.currency,p.rateId);
      const lineItems=p.lineItems&&p.lineItems.length?p.lineItems:(p.items?[{name:p.items,qty:p.qty||1,price:0}]:[]);
      const total=lineItems.reduce((s,r)=>s+r.qty*(r.price||0),0);
      const hasPrice=lineItems.some(r=>r.price>0);
      const displayName=p.label||(lineItems.map(r=>r.name).filter(Boolean).join('、'))||'包裹 #'+p.id;
      // flow bar
      let flowHtml='<div class="status-flow">';
      STATUSES.forEach((s,i)=>{
        const cls=i<si?'done':i===si?'current':'';
        flowHtml+=`<div class="status-step ${cls}" onclick="setParcelStatus(${p.id},'${s.key}')" title="${s.label}"><div class="dot">${i<=si?s.icon:'·'}</div><div class="slabel">${s.label}</div></div>`;
        if(i<STATUSES.length-1)flowHtml+=`<div class="status-line ${i<si?'done':''}"></div>`;
      });
      flowHtml+='</div>';
      // items table
      let itemsHtml='';
      if(lineItems.length){
        itemsHtml=`<div style="margin-bottom:10px"><table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr>
          <th style="text-align:left;padding:4px 8px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);font-size:11px">品項</th>
          <th style="text-align:center;padding:4px 8px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);font-size:11px;width:44px">數量</th>
          ${hasPrice?`<th style="text-align:right;padding:4px 8px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);font-size:11px;width:90px">單價</th>
          <th style="text-align:right;padding:4px 8px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);font-size:11px;width:90px">小計</th>`:''}
        </tr></thead><tbody>`;
        lineItems.forEach(r=>{
          const sub=r.qty*(r.price||0);
          itemsHtml+=`<tr><td style="padding:5px 8px;border-bottom:1px solid var(--border)">${r.name||'—'}</td>
            <td style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:center;color:var(--text2)">×${r.qty}</td>
            ${hasPrice?`<td style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;font-family:'DM Mono',monospace">${r.price?r.price.toLocaleString():''}</td>
            <td style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;font-family:'DM Mono',monospace">${sub?sub.toLocaleString():''}</td>`:''}
          </tr>`;
        });
        if(hasPrice&&total>0){
          const twdStr=rate?` ≈ <span style="color:var(--text3)">NT$ ${Math.round(total*rate).toLocaleString()}</span>`:'';
          const rateRec=p.rateId?D.rateHistory.find(x=>x.id==p.rateId):null;
          const rateLabel=rateRec?rateRec.date:'最新';
          itemsHtml+=`<tr><td colspan="2" style="padding:6px 8px"></td>
            <td style="padding:6px 8px;font-size:11px;color:var(--text3);text-align:right">合計</td>
            <td style="padding:6px 8px;font-weight:600;text-align:right;font-family:'DM Mono',monospace">
              ${total.toLocaleString()} ${p.currency||''}${twdStr}
              ${rate?`<div style="font-size:10px;color:var(--text3);font-weight:400">匯率 ${rate} (${rateLabel})</div>`:''}
            </td></tr>`;
        }
        itemsHtml+=`</tbody></table></div>`;
      }
      // meta
      const metas=[];
      if(wh)metas.push({label:'集運倉',val:`${c?c.flag+' ':''}<b>${wh.name}</b>`});
      if(p.domestic)metas.push({label:'國內貨運碼',val:p.domestic,mono:true,copy:p.domestic});
      if(p.trackno)metas.push({label:'倉庫單號',val:p.trackno,mono:true,copy:p.trackno});
      if(p.indate)metas.push({label:'入倉日',val:p.indate});
      if(p.deadline)metas.push({label:'最晚出倉',val:`${p.deadline} ${deadlineBadge(p.deadline)}`});
      let metaHtml=`<div class="parcel-fields">`;
      metas.forEach(f=>{
        const copyBtn=f.copy?` <button class="btn xs ghost" onclick="copyText('${f.copy.replace(/'/g,"\\'")}')">複製</button>`:'';
        metaHtml+=`<div class="pf"><div class="pf-label">${f.label}</div><div class="pf-val${f.mono?' mono':''}">${f.val}${copyBtn}</div></div>`;
      });
      metaHtml+=`</div>`;
      cardsHtml+=`<div class="parcel-card${p.status==='received'?' status-done':''}" id="pc-${p.id}">
        <div class="parcel-card-head" onclick="window._toggleCard('pc-${p.id}')" style="cursor:pointer">
          <div style="flex:1">
            <div style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px">
              ${displayName}
              <span style="font-size:11px;color:var(--text3);font-weight:400">${STATUSES[si]?.icon||''} ${STATUSES[si]?.label||''}</span>
            </div>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="pc-chevron" style="font-size:11px;color:var(--text3);transition:transform .2s">▼</span>
          </div>
        </div>
        <div class="pc-body" style="display:none">
          ${flowHtml}${itemsHtml}${metaHtml}
          ${p.note?`<div style="font-size:12px;color:var(--text3);margin-top:4px">📝 ${p.note}</div>`:''}
          <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
            <button class="btn xs ghost" onclick="openEditParcel(${p.id})">編輯</button>
            <button class="btn xs danger" onclick="deleteParcel(${p.id})">刪除</button>
          </div>
        </div>
      </div>`;
    });
  }
  document.getElementById('main-content').innerHTML=addBtn+statsHtml+filterHtml+cardsHtml;
}

function setParcelStatus(id,status){
  const p=D.parcels.find(x=>x.id===id);if(!p)return;
  p.status=status;
  if(status==='in_wh'&&!p.indate)p.indate=new Date().toISOString().slice(0,10);
  window._save();renderParcels();
  toast('已更新：'+(STATUSES.find(x=>x.key===status)?.label||status));
}

function _fillWhSelect(){
  const sel=document.getElementById('p-wh-id');
  sel.innerHTML=`<option value="">選擇集運倉</option>`+D.warehouses.map(w=>{const c=getCountry(w.country);return`<option value="${w.id}">${c?c.flag+' ':''}${w.name}</option>`;}).join('');
}

function openAddParcel(){
  editingParcelId=null;
  document.getElementById('parcel-modal-title').textContent='新增包裹';
  _fillWhSelect();fillCurrencySelect('p-currency');populateRateSelect('p-rate-id','');
  ['p-label','p-trackno','p-domestic','p-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('p-indate').value='';document.getElementById('p-deadline').value='';
  document.getElementById('p-status').value='ordered';
  document.getElementById('p-wh-preview').style.display='none';
  document.getElementById('p-item-list').innerHTML='';
  document.getElementById('p-items-total').style.display='none';
  addItemRow();
  openOverlay('parcel');
}

function openEditParcel(id){
  const p=D.parcels.find(x=>x.id===id);if(!p)return;
  editingParcelId=id;
  document.getElementById('parcel-modal-title').textContent='編輯包裹';
  _fillWhSelect();fillCurrencySelect('p-currency');
  document.getElementById('p-wh-id').value=p.whId||'';onWhSelect();
  document.getElementById('p-currency').value=p.currency||'';
  populateRateSelect('p-rate-id',p.currency||'');
  document.getElementById('p-rate-id').value=p.rateId||'';
  document.getElementById('p-label').value=p.label||'';
  document.getElementById('p-status').value=p.status||'ordered';
  document.getElementById('p-trackno').value=p.trackno||'';
  document.getElementById('p-domestic').value=p.domestic||'';
  document.getElementById('p-indate').value=p.indate||'';
  document.getElementById('p-deadline').value=p.deadline||'';
  document.getElementById('p-note').value=p.note||'';
  document.getElementById('p-item-list').innerHTML='';
  const rows=p.lineItems&&p.lineItems.length?p.lineItems:[{name:p.items||'',qty:p.qty||1,price:''}];
  rows.forEach(r=>addItemRow(r));
  recalcItems();
  openOverlay('parcel');
}

function onWhSelect(){
  const id=parseInt(document.getElementById('p-wh-id').value);
  const prev=document.getElementById('p-wh-preview');
  if(!id){prev.style.display='none';return;}
  const wh=D.warehouses.find(w=>w.id===id);if(!wh){prev.style.display='none';return;}
  const c=getCountry(wh.country);
  if(c&&c.currency){document.getElementById('p-currency').value=c.currency;populateRateSelect('p-rate-id',c.currency);}
  const lines=[];
  if(wh.recipient)lines.push(`收件人：${wh.recipient}`);
  if(wh.address)lines.push(`地址：${wh.address.replace(/\n/g,' ')}`);
  if(wh.phone)lines.push(`電話：${wh.phone}`);
  if(wh.member)lines.push(`會員：${wh.member}`);
  prev.innerHTML=`<b>${c?c.flag+' ':''}${wh.name}</b>　<span style="color:var(--text3)">${lines.join('　')}</span>`;
  prev.style.display='block';recalcItems();
}

function addItemRow(data){
  const rid='ir'+(++itemRowId);
  const div=document.createElement('div');div.className='item-row';div.id=rid;
  div.innerHTML=`<input type="text" placeholder="品項名稱" value="${data?.name||''}" oninput="recalcItems()">
    <input type="number" placeholder="數量" value="${data?.qty||1}" min="1" step="1" oninput="recalcItems()">
    <input type="number" class="price" placeholder="單價" value="${data?.price||''}" min="0" step="1" oninput="recalcItems()">
    <button class="item-rm" onclick="document.getElementById('${rid}').remove();recalcItems()">×</button>`;
  document.getElementById('p-item-list').appendChild(div);recalcItems();
}
function getItemRows(){
  return[...document.getElementById('p-item-list').querySelectorAll('.item-row')].map(row=>{
    const ins=row.querySelectorAll('input');
    return{name:ins[0].value.trim(),qty:parseFloat(ins[1].value)||1,price:parseFloat(ins[2].value)||0};
  });
}
function recalcItems(){
  const rows=getItemRows();
  const cur=document.getElementById('p-currency').value;
  const rateId=document.getElementById('p-rate-id')?.value||'';
  const rate=getRate(cur,rateId);
  const total=rows.reduce((s,r)=>s+r.qty*r.price,0);
  const el=document.getElementById('p-items-total'),tx=document.getElementById('p-total-text');
  if(rows.some(r=>r.price>0)&&total>0){
    let t=`${total.toLocaleString()} ${cur||''}`;
    if(rate)t+=` ≈ NT$ ${Math.round(total*rate).toLocaleString()}`;
    tx.textContent=t;el.style.display='flex';
  }else{el.style.display='none';}
}

function saveParcel(){
  const whId=parseInt(document.getElementById('p-wh-id').value)||null;
  const wh=whId?D.warehouses.find(w=>w.id===whId):null;
  const lineItems=getItemRows().filter(r=>r.name||r.price);
  if(!lineItems.length){toast('請至少新增一個品項');return}
  const p={
    id:editingParcelId||Date.now(),whId,country:wh?.country||null,warehouse:wh?.name||'',
    label:document.getElementById('p-label').value.trim(),
    status:document.getElementById('p-status').value||'ordered',
    currency:document.getElementById('p-currency').value||'',
    rateId:document.getElementById('p-rate-id').value||null,
    lineItems,
    items:lineItems.map(r=>r.name+(r.qty>1?'×'+r.qty:'')).filter(Boolean).join('、'),
    qty:lineItems.reduce((s,r)=>s+r.qty,0),
    trackno:document.getElementById('p-trackno').value.trim(),
    domestic:document.getElementById('p-domestic').value.trim(),
    indate:document.getElementById('p-indate').value,
    deadline:document.getElementById('p-deadline').value,
    note:document.getElementById('p-note').value.trim(),shipped:false
  };
  if(editingParcelId){D.parcels=D.parcels.map(x=>x.id===editingParcelId?p:x);}else{D.parcels.push(p);}
  window._save();closeOverlay('parcel');renderParcels();toast(editingParcelId?'包裹已更新':'包裹已新增');
}
function deleteParcel(id){confirmDialog('確定刪除此包裹？').then(ok=>{if(!ok)return;D.parcels=D.parcels.filter(p=>p.id!==id);window._save();renderParcels();});}
